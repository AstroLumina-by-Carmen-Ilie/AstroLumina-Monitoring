# CI for the monitoring manifests: lint, build, schema-check, scan.
# Runs on every push and pull request.
---
name: Monitoring CI

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  KUSTOMIZE_VERSION: v5.8.2
  KUBECONFORM_VERSION: v0.8.0

jobs:
  # YAML style consistency across all manifests.
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install yamllint==1.38.0
      - run: yamllint servicemonitors

  # The servicemonitors/ kustomization must build. Built output is kept for
  # the schema job below.
  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kustomize
        run: >
          curl -sL -o kustomize.tar.gz
          "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2F${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          && tar xzf kustomize.tar.gz kustomize && sudo install kustomize /usr/local/bin/kustomize
      - name: Build the servicemonitors kustomization
        run: |
          mkdir -p /tmp/monbuild
          kustomize build servicemonitors -o /tmp/monbuild/servicemonitors.yaml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kustomize-build
          path: /tmp/monbuild/

  # Strict schema validation against the Kubernetes JSON schemas. The
  # ServiceMonitor CRD is served by kube-prometheus-stack, so it is skipped -
  # no public schema exists for it.
  kubeconform:
    runs-on: ubuntu-latest
    needs: kustomize-build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kustomize-build
          path: /tmp/monbuild
      - name: Install kubeconform
        run: >
          curl -sL -o kubeconform.tar.gz
          "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          && tar xzf kubeconform.tar.gz kubeconform && sudo install kubeconform /usr/local/bin/kubeconform
      - run: kubeconform -summary -skip ServiceMonitor /tmp/monbuild/servicemonitors.yaml

  # Misconfiguration scan. Advisory only (exit-code 0): findings still land
  # in the Security tab via SARIF without blocking on lab-grade trade-offs.
  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # Secret scan with the pinned OSS binary (the official action needs a paid
  # license on org repos). Full-history scan; verified clean, so no extra
  # config file is needed.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: >
          curl -sL -o gitleaks.tar.gz
          https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          && tar xzf gitleaks.tar.gz gitleaks && sudo install gitleaks /usr/local/bin/gitleaks
      - run: gitleaks detect --source . --verbose --exit-code 1
