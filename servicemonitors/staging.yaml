---
# Scrapes the staging LIVE color (namespace astrolumina-staging). Targeting
# the *-live Services (not blue/green directly) keeps the scrape target
# stable across blue/green flips. The frontend is intentionally absent: it is
# static Nginx with no metrics endpoint.
# The `release: monitoring` label must match the Prometheus
# serviceMonitorSelector (default of the kube-prometheus-stack release
# called `monitoring`); without it Prometheus ignores these objects.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: astrolumina-staging-astrology-api
  namespace: monitoring
  labels:
    release: monitoring
    app.kubernetes.io/part-of: astrolumina
spec:
  namespaceSelector:
    matchNames:
      - astrolumina-staging
  selector:
    matchLabels:
      app.kubernetes.io/name: astrology-api
      app.kubernetes.io/component: astrology-api
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
